name: RSS Cache Update

on:
  schedule:
    # 1日4回: 6:00, 11:00, 15:00, 20:00 JST (UTC-9h)
    - cron: '0 21,2,6,11 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch RSS feeds
        run: python scripts/fetch_rss.py

      - name: Commit and push JSON cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update RSS cache [$(date '+%Y-%m-%d %H:%M JST')]"
            git push
          fi
